# P-208: CI — every push to main must keep the engine provably green.
# The harness is the contract (PRD §10 rule 4): algorithm changes without a
# green run are rejected. Determinism + golden locks mean a red build here is
# a DATA or ALGORITHM drift, not flake.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Data integrity + engine harness (data-tests validate registry/recipes/prices in-repo;
             golden + determinism locks must be byte-identical; scripts/validate-*.mjs are for
             incoming LLM batches and are not part of repo CI)
        run: node tests/run-node.mjs
