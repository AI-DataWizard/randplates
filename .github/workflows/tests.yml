# RandPlates CI — P-107 v2 (Day 5 checkpoint): full test + freeze lock on every push.
# The node suite is dependency-free (pure Node 20, no npm install needed), so the
# workflow checks out and runs directly. Any red scenario fails the build.
name: tests

on:
  push:
    branches: ["**"] # main + any feature branch snapshot
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "Node suite (95 scenarios — matcher, data, backup, golden)"
        run: node tests/run-node.mjs

      - name: Data integrity + schema freeze summary
        run: |
          echo "format_version fields (frozen at 1, enforced by data-tests):"
          node -e "for (const f of ['data/ingredients.json','data/prices.json','data/recipes.json']) { const j = require('./' + f); console.log('  ' + f + ' -> format_version ' + j.format_version + ', version ' + j.version); }"

      - name: Syntax check (all app modules + worker)
        run: |
          for f in js/main.js js/modules/*.js js/workers/*.js; do
            node --check "$f"
          done
